buildscript {
  ext.getExtOrDefault = {name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['WiraSdk_' + name]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

plugins {
    id 'com.google.devtools.ksp' version '2.1.20-2.0.1'
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["WiraSdk_" + name]).toInteger()
}

android {
  namespace "com.wirasdk"

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      java.srcDirs += [
        "generated/java",
        "generated/jni"
      ]
    }
  }
}

String storageUrl = System.env.FLUTTER_STORAGE_BASE_URL ?: "https://storage.googleapis.com"

repositories {
  maven {
    url "$rootDir/../../wira-sdk-flutter-component/build/host/outputs/repo"
  }
  google()
  mavenCentral()
  maven {
    url "$storageUrl/download.flutter.io"
  }
}

// Map the legacy package_info_plus coordinates to the actual published group in the local Flutter repo.
configurations.all { config ->
  config.resolutionStrategy.eachDependency { details ->
    if (details.requested.group == 'io.flutter.plugins.packageinfo' &&
        details.requested.name == 'package_info_plus_release') {
      details.useTarget('dev.fluttercommunity.plus.packageinfo:package_info_plus_release:1.0')
    }
  }
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  annotationProcessor 'com.google.dagger:dagger-compiler:2.57.1'
  ksp 'com.google.dagger:dagger-compiler:2.57.1'

  debugImplementation 'com.wira.wira_flutter_module:flutter_debug:1.0'
  releaseImplementation 'com.wira.wira_flutter_module:flutter_release:1.0'
}
